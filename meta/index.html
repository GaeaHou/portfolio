<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meta</title>
  <link rel="stylesheet" href="/portfolio/style.css" />
  <script type="module" src="/portfolio/global.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <section class="summary-panel">
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>
    <div class="stat-grid" id="stats"></div>
    <div class="slider-container">
      <label for="time-slider" class="slider-label">
        Show commits until:
        <input type="range" id="time-slider" min="0" max="100" value="100">
        <time id="selectedTime"></time>
      </label>
    </div>
    <dl class="files">
      <!-- 每个文件的一个 <div> 由 D3 动态生成 -->
    </dl>
  </section>

  <h2 id="chart-title">Commits by time of day</h2>
  <div id="scrollytelling">
    <div id="scroll-container">
      <div id="spacer"></div>
      <div id="items-container"></div>
    </div>
    <div id="chart"></div>
  </div>

  <p id="selection-count">No commits selected</p>
  <div id="language-breakdown" class="language-columns"></div>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>
    <dt>Date</dt>
    <dd id="commit-date"></dd>
    <dt>Time</dt>
    <dd id="commit-time"></dd>
    <dt>Author</dt>
    <dd id="commit-author"></dd>
    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>
</body>
</html>
