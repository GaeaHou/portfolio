<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meta</title>
  <link rel="stylesheet" href="/portfolio/style.css" />
  <script type="module" src="/portfolio/global.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body>

  <section class="summary-panel">
    <h1>Meta</h1>
    
  </section>


  <h2 id="chart-title">Commits by time of day</h2>

  <div style="flex: 1; align-items: baseline; display: flex;">
    <label>
      Show commits until:
      <input type="range" id="commit-progress" min="0" max="100" value="100">
      <time id="commit-time"></time>
    </label>
  </div>
  
  <div class="stat-grid" id="stats"></div>
  <p id="selection-count">No commits selected</p>
  <div id="language-breakdown" class="language-columns">
    <div class="lang-block">
      <div class="lang-name"></div>
      <div class="lang-lines"></div>
      <div class="lang-percent"></div>
    </div>
  </div>
  <div id="scrolly-1">
    <div id="scatter-story">some filler text here</div>
    <div id="scatter-plot">
      

      <div id="chart"></div>
    
     
    </div>
  </div>
  <dl id="files">
    <!-- we want the following structure for each file:
    <div>
      <dt>
        <code>{file.name}</code>
      </dt>
      <dd>{file.lines.length} lines</dd>
    </div>
    -->
  </dl>
  <!-- ✅ 5. Tooltip -->
  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>
    <dt>Date</dt>
    <dd id="commit-date"></dd>
    <dt>Time</dt>
    <dd id="commit-time"></dd>
    <dt>Author</dt>
    <dd id="commit-author"></dd>
    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>
  

</body>
</html>
